<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tak-toe</title>
    <link rel="stylesheet" href="style.css">

            <div class="box">
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>     
                <div class="block"></div>
            </div>
            <div class="result"></div>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
