<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon says</title>
    <link rel="stylesheet" href="simon.css">

</head>
<body>

    <div class="container">
        <h1>Simon Says
        </h1>
        <div class="max">Max score = 0</div>
        <h3>Press any key to start the game</h3>

        <div class="circle">
            <div class="boxes">
                <div class="play col1" id="0" ></div>
                <div class="play col2" id="1"></div>
                <div class="play col3" id="2"></div>
                <div class="play col4" id="3"></div>
            </div>
        </div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
