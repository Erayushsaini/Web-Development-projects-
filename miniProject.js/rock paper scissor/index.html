<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissor</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <header>
            <h1>ROCK &nbsp;PAPER &nbsp;SCISSOR</h1>
        </header>
        <main>
            <div class="action">
                <div class="rock" id="btn"></div>
                <div class="paper" id="btn"></div>
                <div class="scissor" id="btn"></div>
            </div>
            <div class="result">
                <div class="board">
                    <h2>Result board</h2>
        
                </div>
                <div class="score">
                    <div>PLAYER SCORE <span class="user">0</span></div>
                    <div>COMPUTER SCORE <span class="comp">0</span></div>
                </div>

            </div>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
